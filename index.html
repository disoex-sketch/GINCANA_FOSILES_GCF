<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gincana de Fósiles</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="container">
  <h1>Gincana de Fósiles Carboníferos</h1>

  <!-- Marcador de Progreso y Aciertos -->
  <div class="score-board">
    <div class="score-item">
      <span class="score-label">Completados</span>
      <span class="score-value" id="stat-progreso">0 / 10</span>
    </div>
    <div class="score-item">
      <span class="score-label">Aciertos</span>
      <span class="score-value" id="stat-aciertos">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">Nota</span>
      <span class="score-value" id="stat-nota">0%</span>
    </div>
    <button class="btn-reset" onclick="reiniciarGincana()" title="Reiniciar progreso">🔄 Reinicio</button>
  </div>

   <h2 id="titulo-fosil"></h2>

  <div class="image-box">
    <img id="img-fosil" src="" alt="Cargando fósil...">
  </div>

  <div class="question" id="pregunta-txt"></div>
  <div class="options" id="contenedor-opciones"></div>

  <div id="feedback" class="feedback"></div>

  <div id="resena" class="review-card">
    <h3>Ficha técnica:</h3>
    <p id="resena-txt"></p>
  </div>
</div>

<script src="gincana.js"></script>
</body>
</html>
